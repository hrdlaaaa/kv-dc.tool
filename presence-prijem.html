<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nehvizdy DC – Sklad – Příjem | Přehled přítomnosti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./presence.css">
</head>
<body>
  <main class="screen">
    <header class="topbar">
      <div class="brand"><div class="brand-logo-wrap"><img class="brand-logo" src="./kve-logo.png" alt="K&V ELEKTRO"></div></div>
      <div class="title">
        <h1 id="pageHeading">Sklad / Příjem – přehled přítomnosti</h1>
        <p>Aktuální stav zaměstnanců podle docházky</p>
      </div>
      <div class="clock">
        <span id="clockTime" class="clock-time">--:--</span>
        <span id="clockDate" class="clock-date">---</span>
      </div>
    </header>

    <section id="groups" class="groups" aria-live="polite"></section>

    <footer class="footer">
      <div id="connection" class="connection"><span class="connection-dot"></span><span id="connectionText">Připojuji data…</span></div>
      <div id="lastUpdate">Poslední aktualizace: —</div>
    </footer>
  </main>

  <div id="messageOverlay" class="message-overlay hidden">
    <div class="message-card">
      <h2 id="messageTitle">Informace</h2>
      <p id="messageText"></p>
    </div>
  </div>

  <script>
    window.PRESENCE_CONFIG = {
      heading: "Sklad / Příjem – přehled přítomnosti",
      targetGroups: [
        { code: "110701021", name: "Příjem 1" },
        { code: "110701022", name: "Příjem 2" },
        { code: "110701023", name: "Příjem - noční" }
      ],
      notFoundGroups: "Příjem 1, Příjem 2 a Příjem - noční",
      layout: "grid"
    };
  </script>
  <script src="./presence.js"></script>
</body>
</html>
