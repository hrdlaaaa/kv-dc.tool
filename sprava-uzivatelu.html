<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Správa uživatelů | K&amp;V ELEKTRO</title>
  <link rel="stylesheet" href="./base.css">
  <link rel="stylesheet" href="./user-management.css">
</head>
<body>
  <header class="app-header no-print">
    <div class="header-row">
      <div class="header-brand">
        <div class="brand"><img class="brand-logo" src="./kve-logo.png" alt="K&V ELEKTRO"></div>
        <div class="page-title">Správa uživatelů</div>
      </div>
      <div class="header-actor">
        <button type="button" class="header-actor-btn" id="headerActorButton" title="Změnit aktivního uživatele pro audit">
          <span>Aktivní uživatel:</span><strong>Není vybrán</strong>
        </button>
      </div>
    </div>
  </header>

  <div class="app-layout">
    <aside class="sidebar no-print" aria-label="Hlavní navigace">
      <nav class="sidebar-nav">
        <div class="sidebar-section-title">Hlavní</div>
        <a href="./index.html" class="sidebar-link">
          <span class="sidebar-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>
          </span>
          <span class="sidebar-label">Domů</span>
        </a>
        <a href="./preprava.html" class="sidebar-link">
          <span class="sidebar-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h11v10H3z"/><path d="M14 10h4l3 3v4h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>
          </span>
          <span class="sidebar-label">Přeprava</span>
        </a>
        <a href="./kolo-stesti.html" class="sidebar-link">
          <span class="sidebar-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4v4M12 16v4M4 12h4M16 12h4M6.3 6.3l2.8 2.8M14.9 14.9l2.8 2.8M17.7 6.3l-2.8 2.8M9.1 14.9l-2.8 2.8"/><circle cx="12" cy="12" r="2"/></svg>
          </span>
          <span class="sidebar-label">Kolo štěstí</span>
        </a>

        <div class="sidebar-section-title">Sklad a logistika</div>
        <a href="./mapovani-prepravy.html" class="sidebar-link">
          <span class="sidebar-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="11" cy="18" r="2" fill="currentColor" stroke="none"/></svg>
          </span>
          <span class="sidebar-label">Mapování přepravy</span>
        </a>
        <a href="./ctecky.html" class="sidebar-link">
          <span class="sidebar-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h4"/></svg>
          </span>
          <span class="sidebar-label">Čtečky</span>
        </a>
        <a href="./prepravni-boxy.html" class="sidebar-link">
          <span class="sidebar-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8 12 3 3 8l9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
          </span>
          <span class="sidebar-label">Přepravní boxy</span>
        </a>

        <div class="sidebar-section-title">Uživatelé</div>
        <a href="./sprava-uzivatelu.html" class="sidebar-link active" aria-current="page">
          <span class="sidebar-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="3"/><path d="M3 19c0-3 2-5 5-5s5 2 5 5"/><path d="M16 8h5M18.5 5.5v5"/><path d="M15 15h6M15 19h6"/></svg>
          </span>
          <span class="sidebar-label">Správa uživatelů</span>
        </a>
        <a href="./pritomnosti.html" class="sidebar-link">
          <span class="sidebar-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M4 19c0-3 2-5 5-5s5 2 5 5"/><circle cx="17" cy="9" r="2"/><path d="M15 14c3 0 5 2 5 5"/></svg>
          </span>
          <span class="sidebar-label">Přítomnosti</span>
        </a>
        <a href="./dochazkovy-bonus.html" class="sidebar-link">
          <span class="sidebar-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19h16"/><path d="M6 16V8"/><path d="M10 16V5"/><path d="M14 16v-4"/><path d="M18 16V7"/></svg>
          </span>
          <span class="sidebar-label">Docházkový bonus</span>
        </a>

        <div class="sidebar-section-title">Audit</div>
        <a href="./historie-zmen.html" class="sidebar-link">
          <span class="sidebar-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18H6z"/><path d="M9 7h6M9 11h6M9 15h4"/><path d="m15 16 2 2 3-4"/></svg>
          </span>
          <span class="sidebar-label">Historie změn</span>
        </a>
      </nav>
    </aside>

    <div class="content-area">
      <main class="shell">
        <section class="dashboard-page">
          <div class="panel user-management-panel">
            <div class="user-management-head">
              <h1>Správa uživatelů</h1>
              <div class="user-management-head-actions">
                <button id="refreshUserManagementBtn" class="btn btn-secondary user-management-refresh" type="button">Aktualizovat uživatele</button>
                <div id="userManagementStatus" class="user-management-status">Připraveno</div>
              </div>
            </div>
            <div class="user-management-table-wrap">
              <table class="user-management-table">
                <thead>
                  <tr class="user-management-columns">
                    <th>Jméno</th>
                    <th>Místo</th>
                    <th>Oddělení</th>
                    <th>Nadřízený</th>
                    <th>Směna</th>
                    <th>Email</th>
                    <th>Telefon</th>
                    <th class="center-col">Kontrola</th>
                    <th class="center-col">Docházkový bonus</th>
                  </tr>
                  <tr class="user-management-filters">
                    <th><input type="search" data-user-filter="name" aria-label="Filtrovat podle jména" placeholder="Filtrovat"></th>
                    <th><select data-user-filter="place" aria-label="Filtrovat podle místa"><option value="">Vše</option></select></th>
                    <th><select data-user-filter="department" aria-label="Filtrovat podle oddělení"><option value="">Vše</option></select></th>
                    <th><select data-user-filter="manager" aria-label="Filtrovat podle nadřízeného"><option value="">Vše</option></select></th>
                    <th><select data-user-filter="shift" aria-label="Filtrovat podle směny"><option value="">Vše</option></select></th>
                    <th><input type="search" data-user-filter="email" aria-label="Filtrovat podle emailu" placeholder="Filtrovat"></th>
                    <th><input type="search" data-user-filter="phone" aria-label="Filtrovat podle telefonu" placeholder="Filtrovat"></th>
                    <th>
                      <select data-user-filter="control" aria-label="Filtrovat podle kontroly">
                        <option value="">Vše</option>
                        <option value="yes">Ano</option>
                        <option value="no">Ne</option>
                      </select>
                    </th>
                    <th>
                      <select data-user-filter="bonus" aria-label="Filtrovat podle docházkového bonusu">
                        <option value="">Vše</option>
                        <option value="yes">Ano</option>
                        <option value="no">Ne</option>
                      </select>
                    </th>
                  </tr>
                </thead>
                <tbody id="userManagementBody"></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="./audit.js"></script>
  <script src="./user-management.js"></script>
</body>
</html>
