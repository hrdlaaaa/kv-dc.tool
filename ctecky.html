<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Čtečky | K&amp;V ELEKTRO</title>
  <link rel="stylesheet" href="./base.css">
  <link rel="stylesheet" href="./ctecky.css">
</head>
<body>
  <header class="app-header no-print">
    <div class="header-row">
      <div class="header-brand">
        <div class="brand"><img class="brand-logo" src="./kve-logo.png" alt="K&V ELEKTRO"></div>
        <div class="page-title">Čtečky</div>
      </div>
    </div>
  </header>

  <div class="app-layout">
    <aside class="sidebar no-print" aria-label="Hlavní navigace">
      <nav class="sidebar-nav">
        <div class="sidebar-section-title">Hlavní</div>
        <a href="./index.html" class="sidebar-link">
          <span class="sidebar-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>
          </span>
          <span class="sidebar-label">Domů</span>
        </a>
        <a href="./preprava.html" class="sidebar-link">
          <span class="sidebar-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h11v10H3z"/><path d="M14 10h4l3 3v4h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>
          </span>
          <span class="sidebar-label">Přeprava</span>
        </a>

        <div class="sidebar-section-title">Sklad a logistika</div>
        <a href="./mapovani-prepravy.html" class="sidebar-link">
          <span class="sidebar-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="11" cy="18" r="2" fill="currentColor" stroke="none"/></svg>
          </span>
          <span class="sidebar-label">Mapování přepravy</span>
        </a>
        <a href="./ctecky.html" class="sidebar-link active" aria-current="page">
          <span class="sidebar-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h4"/></svg>
          </span>
          <span class="sidebar-label">Čtečky</span>
        </a>
        <a href="./prepravni-boxy.html" class="sidebar-link">
          <span class="sidebar-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8 12 3 3 8l9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
          </span>
          <span class="sidebar-label">Přepravní boxy</span>
        </a>

        <div class="sidebar-section-title">Uživatelé</div>
        <a href="./sprava-uzivatelu.html" class="sidebar-link">
          <span class="sidebar-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="3"/><path d="M3 19c0-3 2-5 5-5s5 2 5 5"/><path d="M16 8h5M18.5 5.5v5"/><path d="M15 15h6M15 19h6"/></svg>
          </span>
          <span class="sidebar-label">Správa uživatelů</span>
        </a>
        <a href="./pritomnosti.html" class="sidebar-link">
          <span class="sidebar-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M4 19c0-3 2-5 5-5s5 2 5 5"/><circle cx="17" cy="9" r="2"/><path d="M15 14c3 0 5 2 5 5"/></svg>
          </span>
          <span class="sidebar-label">Přítomnosti</span>
        </a>
      </nav>
    </aside>

    <div class="content-area">
      <main class="shell">
        <section id="readersPage" class="readers-page">
          <div class="panel readers-panel">
            <div class="readers-head">
              <div>
                <h1>Čtečky</h1>
                <p>Evidence a správa čteček ve skladu.</p>
              </div>
              <button id="addReaderBtn" class="btn primary" type="button">Nová čtečka</button>
            </div>

            <div id="readerSummary" class="reader-summary" aria-label="Souhrn čteček"></div>

            <div class="reader-filters">
              <div class="reader-filters-title">Filtry a vyhledávání</div>
              <div class="reader-filter-grid">
                <label class="reader-filter-field reader-filter-search">
                  <span>Hledat</span>
                  <input id="readerSearch" type="search" placeholder="SN, číslo, IP, ticket…">
                </label>
                <label class="reader-filter-field">
                  <span>Oddělení</span>
                  <select id="readerDepartmentFilter">
                    <option value="">Všechna</option>
                    <option value="PŘÍJEM">PŘÍJEM</option>
                    <option value="VÝDEJ">VÝDEJ</option>
                    <option value="KABELOVKA">KABELOVKA</option>
                    <option value="REVERZNÍ">REVERZNÍ</option>
                  </select>
                </label>
                <label class="reader-filter-field">
                  <span>Typ</span>
                  <select id="readerTypeFilter">
                    <option value="">Všechny</option>
                    <option value="CK3X">CK3X</option>
                    <option value="CK65">CK65</option>
                  </select>
                </label>
                <label class="reader-filter-field">
                  <span>Stav</span>
                  <select id="readerStateFilter">
                    <option value="">Všechny</option>
                    <option value="Dobrý">Dobrý</option>
                    <option value="Nový">Nový</option>
                    <option value="Použitý">Použitý</option>
                    <option value="Servis">Servis</option>
                  </select>
                </label>
              </div>
            </div>

            <div class="reader-table-wrap">
              <table class="reader-table">
                <thead>
                  <tr>
                    <th>Číslo</th>
                    <th><button id="readerSortSn" class="reader-sort" type="button">SN <span id="readerSortSnArrow">↑</span></button></th>
                    <th>IP</th>
                    <th>Oddělení</th>
                    <th>Typ</th>
                    <th>Stav</th>
                    <th>Inventura dne</th>
                    <th>Servis od</th>
                    <th>Ticket</th>
                    <th>Poznámka</th>
                    <th>Akce</th>
                  </tr>
                </thead>
                <tbody id="readerTableBody"></tbody>
              </table>
            </div>
            <div id="readerCount" class="reader-count"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div id="readerModal" class="reader-modal" hidden aria-hidden="true">
    <div class="reader-modal-backdrop" data-reader-modal-close></div>
    <div class="reader-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="readerModalTitle">
      <div class="reader-modal-header">
        <h2 id="readerModalTitle">Nová čtečka</h2>
        <button class="reader-modal-x" type="button" data-reader-modal-close aria-label="Zavřít">×</button>
      </div>
      <form id="readerForm" class="reader-form">
        <input id="readerId" type="hidden">
        <div class="reader-form-grid">
          <label><span>Číslo</span><input id="readerNumber" type="text"></label>
          <label><span>SN *</span><input id="readerSn" type="text" required></label>
          <label><span>IP</span><input id="readerIp" type="text"></label>
          <label><span>Oddělení *</span><select id="readerDepartment" required><option value="">Vyberte oddělení…</option><option>VÝDEJ</option><option>PŘÍJEM</option><option>REVERZNÍ</option><option>KABELOVKA</option></select></label>
          <label><span>Typ *</span><select id="readerType" required><option value="">Vyberte typ…</option><option>CK3X</option><option>CK65</option></select></label>
          <label><span>Stav *</span><select id="readerState" required><option value="">Vyberte stav…</option><option>Nový</option><option>Dobrý</option><option>Servis</option><option>Použitý</option></select></label>
          <label class="reader-form-wide"><span>Poznámka</span><textarea id="readerNote" rows="3"></textarea></label>
          <label><span>Inventura dne</span><input id="readerInventoryDate" type="date"></label>
          <label><span>Servis od</span><input id="readerServiceFrom" type="date"></label>
          <label class="reader-form-wide"><span>Ticket</span><input id="readerTicket" type="url" placeholder="https://…"></label>
        </div>
        <div class="reader-modal-actions">
          <button type="button" id="readerRetireBtn" class="btn reader-retire-btn" hidden>Přesunout do Vyřazeno</button>
          <span class="reader-modal-actions-spacer"></span>
          <button class="btn" type="button" data-reader-modal-close>Zrušit</button>
          <button class="btn primary" type="submit">Uložit</button>
        </div>
      </form>
    </div>
  </div>

  <script src="./readers-seed-data.js"></script>
  <script src="./ctecky.js"></script>
</body>
</html>
